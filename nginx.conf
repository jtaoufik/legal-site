server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # StayFit program-share links moved to the app's own domain (partage-programme-lien-store-officiel).
    # Links already shared as https://legal.../stayfit/share/#<id> land on https://stayfit-app.com/share/#<id>:
    # a browser keeps the #fragment across a redirect, and that page moves the id into the path.
    location ^~ /stayfit/share {
        return 301 https://stayfit-app.com/share/;
    }

    # Drop the .html suffix so /maze-glass/privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # Long cache for icons/static images, short for HTML so updates land fast
    location ~* \.(png|jpg|jpeg|svg|ico|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}
