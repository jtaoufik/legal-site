<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GolfBuddy</title>
<meta name="description" content="GolfBuddy">
<style>
  :root{ --ink:#eef7ec; --lime:#9be37a; --bg:#0f2a1a; --bg2:#14391f; --muted:#b3cbb0; --line:#2b5a37; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
       color:var(--ink);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 96px}
  .crumb{color:var(--muted);font-size:16px;margin-bottom:16px}
  .crumb a{color:var(--muted);text-decoration:none}
  .crumb a:hover{color:var(--lime)}
  h1{font-size:32px;margin:0 0 4px;letter-spacing:-0.5px}
  .updated{color:var(--muted);font-size:16px;margin:0 0 32px}
  h2{font-size:20px;margin:32px 0 8px}
  p, ul{margin:0 0 14px}
  ul{padding-left:22px}
  a{color:var(--lime);overflow-wrap:anywhere}
  .callout,.faq{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:24px 0}
  .faq{margin:14px 0}.faq p{margin:6px 0 0}
  footer{margin-top:64px;color:var(--muted);font-size:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <p class="crumb"><a href="/">Apps</a> · <a href="/golfbuddy/">GolfBuddy</a></p>
  <h1>GolfBuddy</h1>
  

  <p>GolfBuddy is a 3D mini-golf game: solo courses, online matches, ladders and friends.</p>

    <li><a href="/golfbuddy/privacy">Privacy Policy</a></li>
    <li><a href="/golfbuddy/terms">Terms of Use</a></li>
    <li><a href="/golfbuddy/support">Support</a></li>
  </ul>

  <footer><p>© 2026 Taoufik Jabbari · <a href="/golfbuddy/privacy">Privacy</a> · <a href="/golfbuddy/terms">Terms</a> · <a href="/golfbuddy/support">Support</a></p></footer>
</div>
</body>
</html>
